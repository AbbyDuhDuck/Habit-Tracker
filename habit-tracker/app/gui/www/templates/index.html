<!DOCTYPE html>
<html>
<head>
    <title>Habit Tracker</title>
    
    {% include "_app.html" %}
    {% include "_toast.html" %}

</head>
<body>
    {% include "nav.html" %}

    <h2>🦆 Habit Tracker Demo</h2>
    <input id="taskInput" placeholder="New task..." />
    <button onclick="addTask()">Add Task</button>
    <ul id="taskList">
        {% from "_task.html" import render_task %}
        {% for task in tasks %}{{ render_task(task) }}{% endfor %}
    </ul>
</body>
</html>
